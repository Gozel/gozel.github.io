      fr: Vérifier les affirmations, trouver des preuves solides et repérer les contenus trompeurs.
      de: Behauptungen prüfen, belastbare Belege finden und irreführende Inhalte erkennen.
    items:
      - name: Fact Checker
        url: fact-checker
        free: true
        own: true
        kind: tool
        en: Our <strong>free</strong> search engine across fact-checkers approved by the International Fact-Checking Network.
        fr: Notre moteur de recherche <strong>gratuit</strong> parmi les vérificateurs de faits reconnus par l’International Fact-Checking Network.
        de: Unsere <strong>kostenlose</strong> Suchmaschine über Faktenchecker, die vom International Fact-Checking Network anerkannt sind.
      - name: Science Engine
        url: science-search
        free: true
        own: true
        kind: tool
        en: Our <strong>free</strong> search engine across renowned, peer-reviewed scientific sources.
        fr: Notre moteur de recherche <strong>gratuit</strong> parmi des sources scientifiques reconnues et évaluées par les pairs.
        de: Unsere <strong>kostenlose</strong> Suchmaschine über renommierte, begutachtete wissenschaftliche Quellen.
      - name: Media Literacy Starter Kit
        url: /resources/media%20literacy/Shakeri%20-%20Media%20Literacy%20Starter%20Kit.pdf
        free: true
        own: true
        kind: guide
        en: Our <strong>free</strong> practical guide to evaluating information and spotting misleading content (PDF).
        fr: Notre guide pratique <strong>gratuit</strong> pour évaluer l’information et repérer les contenus trompeurs (PDF).
        de: Unser <strong>kostenloser</strong> praktischer Leitfaden, um Informationen zu bewerten und irreführende Inhalte zu erkennen (PDF).
