# List of the Resources page (_layouts/resources.html), in all three languages.
#
# The page texts (title, filter labels, …) are resourcespage.* in lang/<lang>.json.
# clusters: the topics, in the order they appear. id = the section's address, e.g.
#   shakeri.eu/resources#sustainable-business-models (changing it breaks links you have sent).
# Each resource has:
#   name:      its name (proper names stay in English)
#   url:       its official website; the card title links here. Pages of this site: write the
#              page name only, e.g. fact-checker (opens in the reader's language);
#              "think-tank/<piece>/" adds the language too.
#   free_link: where to get it for free, if that is not the website itself, e.g. the published
#              paper: { url: ..., en: ..., fr: ..., de: ... } (the label starts with "Free")
#   own:       true = made by Shakeri et al.; leave out for resources by others
#   free:      true = free to use (even if a paid book or print version also exists); used by the filter
#   kind:      tool, toolkit, guide, book, paper, method or course (shown as a small label)
#   featured:  true = shown as a large highlighted card (with image: path from the site root)
#   en/fr/de:  one sentence on what it is and why it helps. If the resource itself is free and
#              has no free_link, say so and wrap the word in <strong>…</strong> (highlighted).
#              With a free_link, leave "free" out of the text: the link already says it.

clusters:
  - id: design-innovation-methods
    title:
      en: Design & innovation methods
      fr: Méthodes de design et d’innovation
      de: Design- und Innovationsmethoden
    text:
      en: Understand the people you design for, generate ideas and test them quickly.
      fr: Comprendre les personnes pour qui vous concevez, générer des idées et les tester rapidement.
      de: Die Menschen verstehen, für die Sie gestalten, Ideen entwickeln und schnell testen.
    items:
      - name: Design Think Make Break Repeat
        url: https://designthinkmakebreakrepeat.com/
        free: true
        kind: book
        en: 80 design methods, from research and ideation to prototyping and evaluation.
        fr: 80 méthodes de design, de la recherche et de l’idéation au prototypage et à l’évaluation.
        de: 80 Designmethoden – von Recherche und Ideenfindung bis zu Prototyping und Evaluation.
        free_link:
          url: https://designthinkmakebreakrepeat.com/toolkit/
          en: Free method toolkit
          fr: Boîte à outils gratuite
          de: Kostenloses Methoden-Toolkit
      - name: New Metaphors
        url: https://imaginari.es/new-metaphors/
        free: true
        kind: toolkit
        en: A card-based toolkit for reframing problems and generating new ideas.
        fr: Un jeu de cartes pour recadrer les problèmes et générer de nouvelles idées.
        de: Ein kartenbasiertes Toolkit, um Probleme neu zu rahmen und Ideen zu entwickeln.
        free_link:
          url: https://imaginari.es/new-metaphors-downloads/
          en: Free download
          fr: Téléchargement gratuit
          de: Kostenloser Download
      - name: Improv Games for Remote Design
        url: https://www.designinginsights.com/
        free: true
        kind: method
        en: Warm-ups and games that make remote collaboration creative and fun.
        fr: Des jeux et échauffements pour une collaboration à distance créative et ludique.
        de: Warm-ups und Spiele, die Remote-Zusammenarbeit kreativ und unterhaltsam machen.
        free_link:
          url: https://www.designinginsights.com/remote-improv-games-cards
          en: Free cards (PDF)
          fr: Cartes gratuites (PDF)
          de: Kostenlose Karten (PDF)
      - name: Human-centred Design Kit
        url: https://www.designkit.org/
        free: true
        kind: toolkit
        en: Methods and case studies from IDEO.org for designing with the people you serve, all <strong>free</strong> online.
        fr: Des méthodes et études de cas d’IDEO.org pour concevoir avec les personnes que vous servez, entièrement <strong>gratuites</strong> en ligne.
        de: Methoden und Fallstudien von IDEO.org, um gemeinsam mit den Menschen zu gestalten, für die Sie arbeiten – alles <strong>kostenlos</strong> online.
      - name: SAP AppHaus
        url: https://apphaus.sap.com/
        free: true
        kind: method
        en: Human-centred design methods and templates from SAP’s design network, <strong>free</strong> online.
        fr: Des méthodes et modèles de conception centrée sur l’humain, issus du réseau de design de SAP, <strong>gratuits</strong> en ligne.
        de: Methoden und Vorlagen für menschzentriertes Design aus dem Designnetzwerk von SAP – <strong>kostenlos</strong> online.

  - id: systems-thinking
    title:
      en: Systems thinking & more-than-human design
      fr: Pensée systémique et design more-than-human
      de: Systemdenken und More-than-Human Design
    text:
      en: Look beyond the immediate user, see how things are connected and find where to intervene.
      fr: Regarder au-delà de l’utilisateur immédiat, voir comment tout est lié et trouver où intervenir.
      de: Über die unmittelbaren Nutzer:innen hinausblicken, Zusammenhänge erkennen und die richtigen Hebel finden.
    items:
      - name: More-than-Human Systems Mapping Toolkit
        url: think-tank/systemic-more-than-human-design-toolkit/
        free: true
        own: true
        kind: toolkit
        featured: true
        image: think-tank/images/systemic-more-than-human-design-toolkit/More-than-Human-Systems-Mapping-Toolkit.png
        en: Our step-by-step workshop tool for mapping systems with people and the wider living world.
        fr: Notre outil d’atelier, étape par étape, pour cartographier les systèmes avec les humains et l’ensemble du monde vivant.
        de: Unser Workshop-Tool, um Schritt für Schritt Systeme zu kartieren – mit Menschen und der gesamten belebten Welt.
      - name: Systemic Design Toolkit
        url: https://www.systemicdesigntoolkit.org/
        free: true
        kind: toolkit
        en: Tools to understand complex systems and design interventions within them.
        fr: Des outils pour comprendre les systèmes complexes et y concevoir des interventions.
        de: Werkzeuge, um komplexe Systeme zu verstehen und darin wirksam zu gestalten.
        free_link:
          url: https://www.systemicdesigntoolkit.org/download
          en: Free templates
          fr: Modèles gratuits
          de: Kostenlose Vorlagen
      - name: Explorer Labs
        url: https://www.explorerlabs.co/
        free: true
        kind: toolkit
        en: Miro canvases and cards for systems thinking, sustainable business models and foresight.
        fr: Des canevas et cartes Miro pour la pensée systémique, les modèles d’affaires durables et la prospective.
        de: Miro-Canvases und -Karten für Systemdenken, nachhaltige Geschäftsmodelle und strategische Vorausschau.
        free_link:
          url: https://www.explorerlabs.co/tools
          en: Free tools
          fr: Outils gratuits
          de: Kostenlose Tools

  - id: sustainable-business-models
    title:
      en: Sustainable business models
      fr: Modèles d’affaires durables
      de: Nachhaltige Geschäftsmodelle
    text:
      en: Proven patterns for earning money while creating ecological and social value.
      fr: Des modèles éprouvés pour gagner de l’argent tout en créant de la valeur écologique et sociale.
      de: Bewährte Muster, um Geld zu verdienen und dabei ökologischen und sozialen Mehrwert zu schaffen.
    items:
      - name: Sustainable Business Model Design
        url: https://www.sustainablebusiness.design/
        free: true
        kind: book
        en: 45 patterns for sustainable business models.
        fr: 45 modèles pour des modèles d’affaires durables.
        de: 45 Muster für nachhaltige Geschäftsmodelle.
        free_link:
          url: https://www.researchgate.net/publication/325957687_The_Sustainable_Business_Model_Pattern_Taxonomy_-_45_Patterns_to_Support_Sustainability-Oriented_Business_Model_Innovation
          en: Free paper
          fr: Article gratuit
          de: Kostenloser Fachartikel
      - name: St. Gallen Business Model Navigator
        url: https://businessmodelnavigator.com/
        free: true
        kind: book
        en: 55+ business model patterns used by successful companies, explained step by step.
        fr: Plus de 55 modèles d’affaires utilisés par des entreprises à succès, expliqués étape par étape.
        de: Über 55 Geschäftsmodellmuster erfolgreicher Unternehmen, Schritt für Schritt erklärt.
        free_link:
          url: https://alexandria.unisg.ch/server/api/core/bitstreams/d71e2821-d8f8-4cc1-a1ee-97baff7d9e48/content
          en: Free paper
          fr: Article gratuit
          de: Kostenloser Fachartikel
      - name: Circular Ecosystems
        url: https://www.seconds-innovation.com/expertise/sustainability/circular-economy
        free: true
        kind: paper
        en: Business model innovation for the circular economy, with 40 circular patterns.
        fr: L’innovation des modèles d’affaires pour l’économie circulaire, avec 40 modèles circulaires.
        de: Geschäftsmodellinnovation für die Kreislaufwirtschaft, mit 40 zirkulären Mustern.
        free_link:
          url: https://alexandria.unisg.ch/server/api/core/bitstreams/80845b25-a08c-4633-b118-3d2ae0682714/content
          en: Free white paper
          fr: Livre blanc gratuit
          de: Kostenloses Whitepaper
      - name: Triple Layered Business Model Canvas
        url: https://www.sciencedirect.com/science/article/abs/pii/S0959652616307442
        free: true
        kind: paper
        en: Adds an environmental (life-cycle) and a social (stakeholder) layer to the Business Model Canvas, so you design economic, ecological and social value together.
        fr: Ajoute une couche environnementale (cycle de vie) et une couche sociale (parties prenantes) au Business Model Canvas, pour concevoir ensemble valeur économique, écologique et sociale.
        de: Ergänzt das Business Model Canvas um eine ökologische (Lebenszyklus) und eine soziale Ebene (Stakeholder), damit Sie wirtschaftlichen, ökologischen und sozialen Wert gemeinsam gestalten.
        free_link:
          url: https://www.academia.edu/download/82460258/Aula4_20-_20JoycePaquin.pdf
          en: Free paper
          fr: Article gratuit
          de: Kostenloser Fachartikel
      - name: Sustainable Business Model Archetypes
        url: https://www.sciencedirect.com/science/article/pii/S0959652613008032
        free: true
        kind: paper
        en: Eight archetypes of sustainable business models, from maximising material efficiency to repurposing for society and the environment, with real examples. Open access, <strong>free</strong> to read.
        fr: Huit archétypes de modèles d’affaires durables, de l’efficacité matérielle maximale à la réorientation au service de la société et de l’environnement, avec des exemples concrets. En accès libre, <strong>gratuit</strong>.
        de: Acht Archetypen nachhaltiger Geschäftsmodelle – von maximaler Materialeffizienz bis zur Neuausrichtung auf Gesellschaft und Umwelt –, mit Praxisbeispielen. Open Access, <strong>kostenlos</strong> lesbar.
      - name: Sustainable Business Model Innovation
        url: https://www.fhnw.ch/plattformen/tt-bmi/
        free: true
        kind: course
        en: Course slides from FHNW’s TT-BMI programme on why and how to innovate business models for people, planet and profit, with proven strategies, tools and an evaluation funnel.
        fr: Les supports de cours du programme TT-BMI de la FHNW sur pourquoi et comment innover dans les modèles d’affaires pour les personnes, la planète et le profit, avec stratégies éprouvées, outils et entonnoir d’évaluation.
        de: Kursfolien des TT-BMI-Programms der FHNW dazu, warum und wie man Geschäftsmodelle für Mensch, Planet und Profit erneuert – mit bewährten Strategien, Tools und einem Bewertungstrichter.
        free_link:
          url: https://www.fhnw.ch/plattformen/tt-bmi/wp-content/uploads/sites/270/SBMI-Foundation-Slides-v10_02032022.pdf
          en: Free slides (PDF)
          fr: Supports gratuits (PDF)
          de: Kostenlose Folien (PDF)

